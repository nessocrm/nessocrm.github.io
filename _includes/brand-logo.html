{% comment %}theme: auto (nav) | dark (footer on navy) | light{% endcomment %}
{% assign theme = include.theme | default: 'auto' %}
{% if theme == 'dark' %}
<img src="{{ '/assets/images/logo/logo-dark.svg' | relative_url }}" alt="Nesso"
  class="brand-logo" width="3946" height="1040">
{% elsif theme == 'light' %}
<img src="{{ '/assets/images/logo/logo-light.svg' | relative_url }}" alt="Nesso"
  class="brand-logo" width="3946" height="1040">
{% else %}
<img src="{{ '/assets/images/logo/logo-light.svg' | relative_url }}" alt="Nesso"
  class="brand-logo dark:hidden" width="3946" height="1040">
<img src="{{ '/assets/images/logo/logo-dark.svg' | relative_url }}" alt=""
  class="brand-logo hidden dark:block" width="3946" height="1040" aria-hidden="true">
{% endif %}
