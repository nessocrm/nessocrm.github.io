<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesso — Espo da una parte, il sistema esterno dall'altra</title>
    <script>
        (function () {
            var lang = navigator.language || navigator.userLanguage;
            if (lang && lang.toLowerCase().indexOf('it') === 0) {
                window.location.replace('/it/');
            } else {
                window.location.replace('/en/');
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=/it/">
</head>
<body style="background-color:#1B2430;color:#F4F5F7;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;">
    <div style="text-align:center;">
        <p>Nesso</p>
        <p>
            <a href="/it/" style="color:#E4A133;">Italiano</a> ·
            <a href="/en/" style="color:#E4A133;">English</a>
        </p>
    </div>
</body>
</html>
