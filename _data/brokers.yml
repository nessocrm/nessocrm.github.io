# Channels. Letters are the tile, not a third-party logo.
- id: webhook
  name: Webhook
  letter: W
  accent: "#5589CA"
  ink: "#FFFFFF"
  status: live
  status_it: Entra
  status_en: Inbound
  tier: a
  blurb_it: "Il sistema esterno chiama un indirizzo. Il motore confronta il token e manda la riga alle integrazioni in ingresso di quel collegamento."
  blurb_en: "The external system calls an address. The engine checks the token and sends the row to that connection's inbound integrations."
- id: database
  name: Database
  letter: DB
  accent: "#243040"
  ink: "#F4F5F7"
  status: live
  status_it: Solo SELECT
  status_en: SELECT only
  tier: a
  blurb_it: "MySQL, MariaDB, Postgres, SQL Server o Oracle. Il motore legge una SELECT. Senza TLS, MySQL resta la connessione di prima."
  blurb_en: "MySQL, MariaDB, Postgres, SQL Server or Oracle. The engine reads one SELECT. Without TLS, MySQL stays the connection it was."
- id: csv
  name: CSV
  letter: C
  accent: "#E4A133"
  ink: "#1B2430"
  status: live
  status_it: File
  status_en: File
  tier: a
  blurb_it: "Un file in una cartella. Anche con il punto e virgola. Se manca una colonna obbligatoria il file resta dov'è. Se le righe entrano, il file va in elaborati."
  blurb_en: "A file in a folder. A semicolon is fine. If a required column is missing the file stays put. If the rows enter, the file moves to elaborati."
- id: http
  name: HTTP
  letter: H
  accent: "#58C97A"
  ink: "#1B2430"
  status: live
  status_it: Esce
  status_en: Outbound
  tier: a
  blurb_it: "Espo è la sorgente. Il cursore avanza solo dopo i POST riusciti. Se l'indirizzo è vuoto, la casella del motore accumula."
  blurb_en: "Espo is the source. The cursor moves only after the POSTs that succeeded. If the address is empty, the engine inbox keeps the rows."
- id: excel
  name: Excel
  letter: X
  accent: "#8B939C"
  ink: "#FFFFFF"
  status: live
  status_it: Come il CSV
  status_en: Same as CSV
  tier: b
  blurb_it: "Stesse colonne del CSV. Non è un canale diverso: è lo stesso ingresso, un altro foglio."
  blurb_en: "The same columns as CSV. It is not a different channel: it is the same inbound, another sheet."
- id: sftp
  name: SFTP
  letter: S
  accent: "#8B939C"
  ink: "#FFFFFF"
  status: live
  status_it: File remoto
  status_en: Remote file
  tier: b
  blurb_it: "Il file sta su un server, non nella cartella locale. Dopo la lettura va in elaborati, e non viene riletto."
  blurb_en: "The file sits on a server, not in the local folder. After the read it moves to elaborati, and it is not read again."
- id: pdf
  name: PDF
  letter: P
  accent: "#E4A133"
  ink: "#1B2430"
  status: live
  status_it: Sul cliente
  status_en: On the customer
  tier: b
  blurb_it: "Il nome del file contiene la chiave dell'azienda. Diventa un documento sul cliente. Senza la chiave intera, il file resta."
  blurb_en: "The file name contains the company key. It becomes a document on the customer. Without the whole key, the file stays."
- id: documento
  name: Documento
  letter: D
  accent: "#5589CA"
  ink: "#FFFFFF"
  status: live
  status_it: Cartella
  status_en: Folder
  tier: b
  blurb_it: "Un documento in una cartella di Espo, con un team se lo si indica. Cartella e team sono facoltativi."
  blurb_en: "A document in an Espo folder, with a team if you name one. Folder and team are optional."
- id: writeback
  name: Ritorno
  letter: R
  accent: "#243040"
  ink: "#E4A133"
  status: queued
  status_it: Spento
  status_en: Off
  tier: c
  rail: false
  blurb_it: "La scrittura verso il gestionale resta spenta finché non la si accende su quell'integrazione. Allora tocca solo le colonne indicate."
  blurb_en: "Writing back to the ERP stays off until you turn it on for that integration. Then it touches only the columns you named."
- id: retry
  name: Ritento
  letter: Q
  accent: "#243040"
  ink: "#E4A133"
  status: queued
  status_it: Spento
  status_en: Off
  tier: c
  rail: false
  blurb_it: "La coda è spenta. Accesa, riguarda una riga in ingresso con identità esterna, non l'uscita e non lo stesso giro."
  blurb_en: "The queue is off. On, it applies to an inbound row with an external identity, not to outbound and not to the same run."
- id: portal
  name: Portale
  letter: Po
  accent: "#243040"
  ink: "#E4A133"
  status: queued
  status_it: Non è un portale
  status_en: Not a portal
  tier: c
  rail: false
  blurb_it: "Nesso non crea utenti del portale e non cambia i ruoli. La regola, se accesa, tiene fuori dall'uscita i record di un altro team."
  blurb_en: "Nesso does not create portal users and does not change roles. The rule, if on, keeps another team's records out of outbound."
- id: secrets
  name: Segreti
  letter: K
  accent: "#243040"
  ink: "#E4A133"
  status: queued
  status_it: In chiaro se manca la chiave
  status_en: Clear text without the key
  tier: c
  rail: false
  blurb_it: "Senza NESSO_SECRET_KEY la password del database resta in chiaro nel volume. Con la variabile i salvataggi nuovi si sigillano."
  blurb_en: "Without NESSO_SECRET_KEY the database password stays in clear text on the volume. With the variable, new saves are sealed."
- id: mail
  name: Posta
  letter: M
  accent: "#8B939C"
  ink: "#FFFFFF"
  status: blocked
  status_it: Resta in Espo
  status_en: Stays in Espo
  tier: d
  rail: false
  blurb_it: "La posta del CRM non si riscrive qui. Nesso non la manda."
  blurb_en: "CRM mail is not rewritten here. Nesso does not send it."
- id: advanced
  name: Advanced Pack
  letter: A
  accent: "#8B939C"
  ink: "#FFFFFF"
  status: blocked
  status_it: Non si pubblica
  status_en: Not published
  tier: d
  rail: false
  blurb_it: "Report e processi dell'Advanced Pack restano di Espo. Il pacchetto non entra nel repository."
  blurb_en: "Advanced Pack reports and processes stay Espo's. The package does not enter the repository."
- id: users
  name: Utenti Espo
  letter: U
  accent: "#8B939C"
  ink: "#FFFFFF"
  status: blocked
  status_it: Non nascono da un file
  status_en: Not born from a file
  tier: d
  rail: false
  blurb_it: "Un'anagrafica persone non crea utenti. Il team e l'assegnatario si indicano, l'utente no."
  blurb_en: "A people master does not create users. The team and the assignee are named. The user is not."
- id: sql
  name: SQL su Espo
  letter: "No"
  accent: "#1B2430"
  ink: "#FFFFFF"
  status: blocked
  status_it: Non è il prodotto
  status_en: Not the product
  tier: e
  rail: false
  blurb_it: "Niente query sulle tabelle di Espo. Se serve un record, si passa dall'API."
  blurb_en: "No queries on Espo's tables. If a record is needed, it goes through the API."
- id: anybridge
  name: Due sistemi qualunque
  letter: "No"
  accent: "#1B2430"
  ink: "#FFFFFF"
  status: blocked
  status_it: Non è il prodotto
  status_en: Not the product
  tier: e
  rail: false
  blurb_it: "Nesso ha sempre Espo da un lato. Non è un ponte fra due gestionali."
  blurb_en: "Nesso always has Espo on one side. It is not a bridge between two ERPs."
- id: dump
  name: Dump di produzione
  letter: "No"
  accent: "#1B2430"
  ink: "#FFFFFF"
  status: blocked
  status_it: Non si importa
  status_en: Not imported
  tier: e
  rail: false
  blurb_it: "La prova usa un Espo vuoto. Il backup di produzione non si monta e non si importa."
  blurb_en: "The trial uses an empty Espo. The production backup is not mounted and not imported."
