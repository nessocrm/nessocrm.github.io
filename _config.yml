faq_it:
  - question: "Che cos’è Nesso?"
    answer: "Nesso è uno strumento di integrazione che trasferisce dati tra EspoCRM e i sistemi aziendali. Dall’interfaccia configuri canali, schede, abbinamenti dei campi e frequenza degli aggiornamenti. Puoi verificare le modifiche in anteprima e consultare gli esiti."
  - question: "Quali sistemi posso collegare?"
    answer: "Puoi usare webhook, database MySQL, MariaDB, PostgreSQL, SQL Server e Oracle, file CSV ed Excel, trasferimenti SFTP e FTPS, documenti e destinazioni HTTP. La compatibilità dipende dai formati e dalle interfacce del sistema esterno: va verificata sul tuo caso."
  - question: "Posso proteggere le modifiche fatte dal team nel CRM?"
    answer: "Sì. Per ogni campo puoi assegnare la priorità a EspoCRM. Nei record esistenti il valore del CRM viene conservato e le differenze sono raccolte per la verifica. Se invece prevale la sorgente esterna, anche un valore vuoto può svuotare il campo nel CRM."
  - question: "Posso controllare un’importazione prima di applicarla?"
    answer: "Sì. L’anteprima mostra le modifiche previste e gli eventuali problemi. La prova a secco controlla un campione senza scrivere su EspoCRM. Sono disponibili anche la modalità di sola lettura per integrazione e il blocco generale delle scritture."
  - question: "Come vengono gestiti i record assenti dalla sorgente?"
    answer: "Quando la gestione delle assenze è configurata e la scheda dispone di uno stato compatibile, Nesso può chiudere il record mantenendolo nello storico. La prima chiusura richiede conferma. La chiusura non equivale alla cancellazione dei dati personali."
  - question: "Gli aggiornamenti possono essere automatici?"
    answer: "Sì. Puoi avviare i flussi manualmente, ogni 5 minuti, ogni 15 minuti, ogni ora o a un orario fisso. I webhook ricevono invece i dati quando il sistema esterno li invia. Esiti e anomalie sono consultabili nell’applicazione."
  - question: "Nesso scrive anche nel database del gestionale?"
    answer: "La scrittura di ritorno è disattivata per impostazione predefinita. Puoi abilitarla per una specifica integrazione e limitarla alle colonne indicate. Gli invii da EspoCRM tramite HTTP e i trasferimenti file si configurano nei relativi collegamenti."
  - question: "Come comunica con EspoCRM?"
    answer: "Nesso legge e scrive su EspoCRM tramite le API HTTP, senza eseguire query SQL sul database del CRM. Legge anche le schede e i campi disponibili nella tua installazione, incluse le schede personalizzate."
  - question: "È necessario un servizio di intelligenza artificiale?"
    answer: "No. Le proposte di abbinamento basate sui nomi e sui sinonimi funzionano localmente. Puoi configurare un modello esterno per completare gli abbinamenti mancanti: in quel caso la richiesta può includere nomi di colonne e campioni di celle. Le proposte richiedono sempre una verifica prima del salvataggio."
  - question: "Come vengono protette le credenziali salvate?"
    answer: "La protezione delle credenziali nel volume locale richiede la variabile NESSO_SECRET_KEY. Senza questa variabile, le credenziali restano in chiaro nel file SQLite. La demo non la imposta: verifica questa configurazione prima di utilizzare credenziali aziendali."
  - question: "Sono disponibili nuovi tentativi automatici dopo un errore?"
    answer: "La coda dei nuovi tentativi è un’opzione da abilitare e riguarda le righe in ingresso con un identificativo esterno. Negli invii HTTP, l’avanzamento dopo le consegne riuscite permette di riprendere i record non consegnati nelle esecuzioni successive. I dettagli sono nel manuale."
  - question: "Nesso gestisce gli utenti e il portale di EspoCRM?"
    answer: "Nesso può assegnare record a team e utenti esistenti. Non crea utenti del CRM o del portale a partire dalle anagrafiche. È disponibile un filtro opzionale per limitare l’uscita dei record in base al team."
  - question: "I modelli sono connettori certificati per il mio gestionale?"
    answer: "No. Preparano abbinamenti per anagrafiche, contatti, sedi e listini, da adattare ai tuoi dati e ai campi disponibili in EspoCRM. Il modello listino richiede la scheda Product già presente."
  - question: "Come posso provare Nesso?"
    answer: "Il repository pubblico include istruzioni, manuale e ambiente Docker Compose. Il primo avvio installa EspoCRM e carica la demo Gruppo Meridia con dati fittizi. Non serve registrarsi sul sito. Le estensioni commerciali di EspoCRM non sono distribuite nel repository."

faq_en:
  - question: "What is Nesso?"
    answer: "It is the engine that moves records between an external system and EspoCRM. You configure the channel, the sheet and the field mapping. From then on the same engine moves the records. It is not a second CRM and it is not a connector with an ERP's name written in the code."
  - question: "Does it talk to Espo's tables?"
    answer: "No. Every read and every write toward Espo goes through the HTTP API, with the Espo-Authorization header. No SQL on Espo's tables."
  - question: "Which channels are there?"
    answer: "Inbound: webhook, a database read with SELECT only, CSV, Excel, SFTP, FTPS, a PDF whose name contains the company key, a document. Outbound: HTTP. The database can be MySQL, MariaDB, Postgres, SQL Server or Oracle."
  - question: "Who wins if the cell arrives empty?"
    answer: "By default the source wins, even if the cell is empty. A field can have another owner, Espo: then the night run does not clear it. That is the rule that protects a note a person wrote."
  - question: "If the customer disappears from the file, what happens in Espo?"
    answer: "The record is closed and stays in the history. It is not deleted. The first close asks for confirmation. The right to be forgotten is a different act, and it is not this close."
  - question: "Does it also write back to the ERP?"
    answer: "Not until write-back is turned on for that integration. When it is on, it touches only the columns you named."
  - question: "Does it create Espo users from a master file?"
    answer: "No. A team and a person are assigned from a column or from a fixed value. A user is not created."
  - question: "Can the night run start on its own?"
    answer: "Yes, if the cadence is 5 minutes, 15, one hour, or a fixed time. The same integration does not start twice. Two different integrations can run together. After an error it waits the whole interval, unless retry_failed is on."
  - question: "Is there a queue that resends failed rows?"
    answer: "It stays off. With retry_queue on, only an inbound row that has an external identity, and not in the same run. Outbound is not sent again: the cursor already retries the record that did not leave."
  - question: "Are passwords stored in clear text?"
    answer: "Without the NESSO_SECRET_KEY variable, yes, in the SQLite file of the local volume. With the variable a new save is sealed and a password already in clear text still opens. The trial does not set the variable."
  - question: "Does Nesso run the Espo portal?"
    answer: "No. It does not create portal users and it does not change roles. If the rule is on, outbound skips records of another team. Off, outbound does not change."
  - question: "Are the recipes my ERP's connector?"
    answer: "No. Accounts, contacts and sites prepare a mapping to review, on the fields Espo already has. The price list points at Product: if the sheet is missing, the fields stay empty. It is not a certified connector."
  - question: "How do I try it?"
    answer: "From the public repository, with Docker. It starts an empty Espo. Production dumps are not imported. The Gruppo Meridia demo is the proof, not a second product."

